<!-- Reusable field partial for import_marks_correlation -- see import_class_schedule's field
     partial for the shared-mounting convention. -->
<div class="space-y-1.5">
    <label class="block text-muted font-mono uppercase tracking-wider text-[10px]">Pending Files (01_inbox/reports)</label>
    <div data-field="file-list" class="border border-border rounded-lg divide-y divide-border max-h-36 overflow-y-auto custom-scrollbar">
        <div class="p-3 text-muted">Loading pending files...</div>
    </div>
</div>

<div class="space-y-1.5 mt-4">
    <label class="block text-muted font-mono uppercase tracking-wider text-[10px]">Custom Folder Path (optional)</label>
    <input type="text" data-field="custom-path" placeholder="e.g. C:\Data\Marks Reports" class="w-full bg-canvas border border-border rounded px-3 py-2 text-heading font-mono focus:outline-none focus:border-primary">
    <p class="text-[10px] text-muted leading-relaxed">Leave blank to import from 01_inbox/reports above. Fill this in to instead scan a different local folder for .xlsx workbooks.</p>
</div>

<script>
    function escapeHtmlImc(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.refreshImportMarksCorrelationFileList = function(container) {
        const listEl = container.querySelector('[data-field="file-list"]');
        return fetch("/api/inbox").then(r => r.json()).then(data => {
            const xlsxFiles = (data.reports || []).filter(name => name.toLowerCase().endsWith(".xlsx"));
            if (!xlsxFiles.length) {
                listEl.innerHTML = `<div class="p-3 text-muted">No pending .xlsx files in 01_inbox/reports.</div>`;
            } else {
                listEl.innerHTML = xlsxFiles.map(name => `
                    <div class="flex items-center gap-2 p-2.5 text-heading">
                        <i class="fa-solid fa-file-excel text-success-400 text-[11px]"></i>
                        <span class="truncate">${escapeHtmlImc(name)}</span>
                    </div>
                `).join("");
            }
        }).catch(() => {
            listEl.innerHTML = `<div class="p-3 text-danger-400">Could not load pending files.</div>`;
        });
    };

    window.initImportMarksCorrelationFields = function(container, savedParams, onValidityChange) {
        const pathInput = container.querySelector('[data-field="custom-path"]');
        pathInput.value = (savedParams && savedParams.args && savedParams.args[0]) || "";
        window.refreshImportMarksCorrelationFileList(container);
        if (onValidityChange) onValidityChange(true); // custom path is always optional
    };

    window.readImportMarksCorrelationFields = function(container) {
        const pathInput = container.querySelector('[data-field="custom-path"]');
        const val = pathInput.value.trim();
        return { args: val ? [val] : [] };
    };
</script>
