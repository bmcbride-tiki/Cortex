<div class="flex gap-4 h-full animate-fade-in" id="wfb-root">
    <!-- Left palette: search + alphabetical, scrollable list of every draggable building block -->
    <div class="w-64 shrink-0 bg-surface border border-border rounded-xl flex flex-col overflow-hidden">
        <div class="p-3 border-b border-border shrink-0 space-y-2">
            <input type="text" id="wfb-palette-search" placeholder="Search building blocks..." class="w-full bg-canvas border border-border rounded px-3 py-2 text-heading text-xs focus:outline-none focus:border-primary">
            <div id="wfb-kind-filter" class="flex flex-wrap gap-x-3 gap-y-1 text-[10px] font-mono text-muted">
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="wfb-kind" value="all" checked class="accent-primary">All</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="wfb-kind" value="skill" class="accent-primary">Skill</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="wfb-kind" value="process" class="accent-primary">Process</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="wfb-kind" value="task" class="accent-primary">Task</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="wfb-kind" value="adapter" class="accent-primary">Adapter</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="wfb-kind" value="function" class="accent-primary">Function</label>
            </div>
        </div>
        <div class="p-2 border-b border-border shrink-0">
            <div draggable="true" id="wfb-container-palette-item" class="flex items-stretch rounded-lg border border-dashed border-primary/40 bg-primary/5 hover:bg-primary/10 cursor-grab active:cursor-grabbing transition-colors overflow-hidden">
                <div class="wfb-icon-chip" style="background: color-mix(in oklch, var(--color-primary-400) 18%, transparent);">
                    <i class="fa-solid fa-box-archive" style="color: var(--color-primary-400); font-size: 15px;"></i>
                </div>
                <div class="flex-1 min-w-0 p-2.5">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-medium text-heading truncate">Container</span>
                        <span class="text-[9px] font-mono uppercase shrink-0 text-primary-400">Container</span>
                    </div>
                    <p class="text-[10px] text-muted leading-snug mt-1">Holds its own mini sub-flow. Double-click on the canvas to open it.</p>
                </div>
            </div>
        </div>
        <div id="wfb-palette-list" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
            <div class="text-muted font-mono text-[10px] p-2 animate-pulse">Loading building blocks...</div>
        </div>
    </div>

    <!-- Center: toolbar + canvas -->
    <div class="flex-1 flex flex-col min-w-0 gap-3">
        <div class="bg-surface border border-border rounded-xl p-3 flex items-center gap-2 flex-wrap shrink-0">
            <input type="text" id="wfb-workflow-name" placeholder="Untitled Workflow" class="bg-canvas border border-border rounded px-3 py-1.5 text-heading text-xs font-mono w-48 focus:outline-none focus:border-primary">
            <select id="wfb-load-select" class="bg-canvas border border-border rounded px-2 py-1.5 text-body text-xs focus:outline-none focus:border-primary max-w-[10rem]">
                <option value="">-- Load saved workflow --</option>
            </select>
            <div class="w-px h-5 bg-border mx-1"></div>
            <button onclick="window.wfbNew()" class="px-2.5 py-1.5 bg-surface-2 hover:bg-border border border-border-strong text-[11px] font-mono rounded text-heading transition-colors">New</button>
            <button onclick="window.wfbSave()" class="px-2.5 py-1.5 bg-primary/10 hover:bg-primary text-primary-400 hover:text-heading border border-primary/20 text-[11px] font-mono rounded transition-colors">Save</button>
            <button onclick="window.wfbDelete()" class="px-2.5 py-1.5 bg-danger/10 hover:bg-danger text-danger-400 hover:text-heading border border-danger/20 text-[11px] font-mono rounded transition-colors">Delete</button>
            <div class="w-px h-5 bg-border mx-1"></div>
            <label class="flex items-center gap-1.5 text-[11px] text-muted font-mono">
                <input type="checkbox" id="wfb-dry-run" checked class="accent-primary">
                Dry Run
            </label>
            <button onclick="window.wfbRun()" id="wfb-run-btn" class="px-3 py-1.5 bg-success/10 hover:bg-success text-success-400 hover:text-heading border border-success/20 text-[11px] font-semibold rounded transition-colors flex items-center gap-1.5">
                <i class="fa-solid fa-play"></i> Run
            </button>
            <div class="ml-auto flex items-center gap-1">
                <button onclick="window.wfbZoomOut()" class="w-7 h-7 flex items-center justify-center bg-surface-2 hover:bg-border border border-border-strong rounded text-muted hover:text-heading transition-colors"><i class="fa-solid fa-magnifying-glass-minus text-[11px]"></i></button>
                <button onclick="window.wfbZoomReset()" class="w-7 h-7 flex items-center justify-center bg-surface-2 hover:bg-border border border-border-strong rounded text-muted hover:text-heading transition-colors"><i class="fa-solid fa-compress text-[11px]"></i></button>
                <button onclick="window.wfbZoomIn()" class="w-7 h-7 flex items-center justify-center bg-surface-2 hover:bg-border border border-border-strong rounded text-muted hover:text-heading transition-colors"><i class="fa-solid fa-magnifying-glass-plus text-[11px]"></i></button>
            </div>
        </div>

        <div id="wfb-breadcrumb" class="hidden bg-surface border border-border rounded-lg px-3 py-1.5 text-[11px] font-mono text-muted flex items-center gap-1.5 shrink-0"></div>

        <div class="flex-1 bg-surface border border-border rounded-xl overflow-hidden relative min-h-0">
            <div id="wfb-canvas" class="w-full h-full"></div>
        </div>

        <!-- Model toggles (filter the palette by AI backend) + live classification ceiling
             (computed from AI-model nodes actually placed on the canvas). Per the
             information security classification guide, most-restrictive-model-wins. -->
        <div class="bg-surface border border-border rounded-xl shrink-0 p-3 flex items-center gap-4 flex-wrap">
            <div id="wfb-model-toggles" class="flex items-center gap-3 flex-wrap text-[11px] font-mono"></div>
            <div class="ml-auto flex items-center gap-2">
                <span class="text-[10px] font-mono uppercase tracking-wider text-muted">Workflow Classification:</span>
                <span id="wfb-classification-badge" class="px-2 py-0.5 rounded text-[10px] font-mono uppercase border text-muted border-border">No AI model in use</span>
            </div>
        </div>

        <div class="bg-surface border border-border rounded-xl shrink-0 h-40 flex flex-col">
            <div class="px-4 py-2 border-b border-border flex items-center justify-between shrink-0">
                <span class="text-[10px] font-mono uppercase tracking-wider text-muted">Run Log</span>
                <span id="wfb-run-status" class="text-[10px] font-mono text-muted">Ready</span>
            </div>
            <div id="wfb-run-log" class="flex-1 overflow-y-auto custom-scrollbar p-3 font-mono text-[11px] space-y-1 leading-relaxed">
                <div class="text-muted">// Configure nodes, connect them, and click Run.</div>
            </div>
        </div>
    </div>

    <!-- Right panel: selected node's config, identical fields to its popup where one exists -->
    <div class="w-80 shrink-0 bg-surface border border-border rounded-xl flex flex-col overflow-hidden relative">
        <div class="px-4 py-3 border-b border-border shrink-0">
            <h4 class="text-xs font-semibold text-heading uppercase tracking-wider">Node Configuration</h4>
        </div>
        <div id="wfb-panel-header" class="hidden px-4 py-3 border-b border-border shrink-0 space-y-2">
            <div class="space-y-1.5">
                <label class="block text-muted font-mono uppercase tracking-wider text-[10px]">Output Label (reference as {{label}})</label>
                <div class="flex gap-1.5">
                    <input type="text" id="wfb-panel-label-input" class="flex-1 bg-canvas border border-border rounded px-3 py-2 text-heading font-mono text-xs focus:outline-none focus:border-primary">
                    <button onclick="window.wfbSaveLabel()" class="px-3 py-1.5 bg-primary/15 hover:bg-primary/25 text-primary-400 border border-primary/30 text-xs font-semibold rounded transition-colors">Save</button>
                </div>
            </div>
            <div class="space-y-1">
                <label class="block text-muted font-mono uppercase tracking-wider text-[10px]">Input(s)</label>
                <div id="wfb-panel-inputs" class="flex flex-wrap gap-1"></div>
            </div>
        </div>
        <div id="wfb-panel-body" class="flex-1 overflow-y-auto custom-scrollbar p-4 text-xs space-y-3">
            <div class="text-muted">Select a node on the canvas to configure it.</div>
        </div>
        <div id="wfb-token-suggest" class="hidden absolute z-50 bg-surface border border-border-strong rounded-lg shadow-lg max-h-40 overflow-y-auto custom-scrollbar text-xs"></div>
    </div>
</div>

<style>
    /* Drawflow theme override -- match this app's own surface/border/primary tokens
       instead of the library's default light theme. */
    #wfb-canvas.drawflow { background-color: var(--color-canvas); background-image: radial-gradient(var(--color-border) 1px, transparent 1px); background-size: 18px 18px; }
    #wfb-canvas .drawflow-node { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; color: var(--color-heading); padding: 0; min-width: 160px; box-shadow: none; }
    #wfb-canvas .drawflow-node.selected { border-color: var(--color-primary); box-shadow: 0 0 0 2px color-mix(in oklch, var(--color-primary) 30%, transparent); }
    #wfb-canvas .drawflow-node.kind-container { border-style: dashed; border-color: color-mix(in oklch, var(--color-primary) 50%, var(--color-border)); }
    #wfb-canvas .drawflow-node.kind-human-checkpoint { border-width: 2px; border-color: var(--color-warning-400); }
    #wfb-canvas .drawflow-node.kind-greyed { opacity: 0.45; border-style: dashed; }
    #wfb-canvas .drawflow-node.kind-greyed .wfb-node-title { color: var(--color-muted); }
    #wfb-canvas .drawflow-node .input, #wfb-canvas .drawflow-node .output { background: var(--color-primary-400); height: 14px; width: 14px; border: 2px solid var(--color-surface); }
    #wfb-canvas .connection .main-path { stroke: var(--color-primary-400); stroke-width: 3px; }
    #wfb-canvas .connection .main-path:hover { stroke: var(--color-danger-400); cursor: pointer; }
    .wfb-node-card { display: flex; align-items: stretch; border-radius: 10px; overflow: hidden; }
    .wfb-node-card .wfb-node-body { padding: 10px 14px; min-width: 0; flex: 1; }
    .wfb-node-card .wfb-node-title { font-size: 12px; font-weight: 600; color: var(--color-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wfb-node-card .wfb-node-kind { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-muted); margin-top: 2px; font-family: var(--font-mono); }
    /* n8n-style icon chip: spans the full height of whatever row/card it's in, so a
       small logo/glyph never looks stranded next to a taller text block. */
    .wfb-icon-chip { flex-shrink: 0; width: 34px; display: flex; align-items: center; justify-content: center; }
    .wfb-icon-chip img { width: 18px; height: 18px; object-fit: contain; }
    .wfb-icon-chip.wfb-icon-chip-brand { background: #f4f4f5; }
</style>

<script>
    (function() {
        const FIELD_PARTIAL_TOOL_IDS = ["import_class_schedule", "import_marks_correlation", "word_to_excel_exam"];
        const KIND_LABELS = { task: "Task", process: "Process", adapter: "Adapter", skill: "Skill", function: "Function" };
        const KIND_COLORS = { task: "text-primary-400", process: "text-info-400", adapter: "text-danger-400", skill: "text-warning-400", function: "text-secondary-400" };
        // Same per-kind palette as KIND_COLORS above, as CSS var names -- used to tint the
        // icon chip background for nodes with no real brand logo (server sends icon_source:
        // "fa" for those; icon_source: "svgl" nodes get a plain white chip so the brand's own
        // colors show through instead, same convention n8n uses for third-party logos).
        const KIND_ICON_VARS = { task: "--color-primary-400", process: "--color-info-400", adapter: "--color-danger-400", skill: "--color-warning-400", function: "--color-secondary-400" };

        // Shared by the palette list and the canvas node card so both show the identical
        // icon -- a real product SVG (icon_source: "svgl") in a neutral chip, or a Font
        // Awesome glyph (icon_source: "fa") tinted to the node's kind color.
        function nodeIconChipHtml(meta) {
            if (meta.icon_source === "svgl" && meta.svgl_icon_url) {
                return `<div class="wfb-icon-chip wfb-icon-chip-brand"><img src="${escapeHtml(meta.svgl_icon_url)}" onerror="this.parentElement.style.display='none'" alt=""></div>`;
            }
            const colorVar = KIND_ICON_VARS[meta.kind] || "--color-muted";
            const faIcon = meta.fa_icon || "fa-code";
            return `<div class="wfb-icon-chip" style="background: color-mix(in oklch, var(${colorVar}) 18%, transparent);">
                <i class="fa-solid ${escapeHtml(faIcon)}" style="color: var(${colorVar}); font-size: 15px;"></i>
            </div>`;
        }
        // Specific tool_ids that get a distinct canvas treatment beyond their normal kind
        // styling -- keyed by tool_id rather than a whole new node kind, so any future
        // human-in-the-loop function can opt in the same way without engine changes.
        const HUMAN_CHECKPOINT_TOOL_IDS = ["human_review_checkpoint"];

        let editor = null;
        let registry = [];
        let modelClassifications = { levels: [], labels: {}, models: {} };
        let modelToggleOrder = [];
        let modelToggles = {};
        let currentWorkflowId = null;
        let selectedNodeId = null;
        let currentModuleName = "Home";
        let moduleBreadcrumb = [{ name: "Home", title: "Home" }];
        let containerCounter = 0;

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function ensureDrawflowLoaded() {
            return new Promise((resolve, reject) => {
                if (window.Drawflow) { resolve(); return; }
                const link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = "/static/vendor/drawflow/drawflow.min.css";
                document.head.appendChild(link);

                const script = document.createElement("script");
                script.src = "/static/vendor/drawflow/drawflow.min.js";
                script.onload = resolve;
                script.onerror = () => reject(new Error("Could not load the canvas engine."));
                document.head.appendChild(script);
            });
        }

        // --- Palette -----------------------------------------------------------------

        function selectedKindFilter() {
            const checked = document.querySelector('input[name="wfb-kind"]:checked');
            return checked ? checked.value : "all";
        }

        function renderPalette(filterText) {
            const container = document.getElementById("wfb-palette-list");
            const term = (filterText || "").trim().toLowerCase();
            const kindFilter = selectedKindFilter();

            // Search always scans every kind; the radio filter only shapes what shows
            // when the search box is empty.
            const filtered = registry.filter(n => {
                // A node tied to a toggled-off AI model is hidden regardless of the
                // search term -- the toggles are a hard security-relevant filter, not
                // just a convenience one.
                if (n.model && modelToggles[n.model] === false) return false;
                const matchesSearch = !term || n.title.toLowerCase().includes(term) || (n.description || "").toLowerCase().includes(term);
                if (!matchesSearch) return false;
                if (term) return true;
                return kindFilter === "all" || n.kind === kindFilter;
            });

            if (!filtered.length) {
                container.innerHTML = `<div class="text-muted font-mono text-[10px] p-2">No matches.</div>`;
                return;
            }

            container.innerHTML = filtered.map(n => {
                const lockIcon = n.licensed === false ? `<i class="fa-solid fa-lock text-muted text-[10px]" title="Requires ${escapeHtml(n.required_capability || "")} license"></i>` : "";
                const greyedClass = n.licensed === false ? "opacity-45 grayscale" : "";
                return `
                <div draggable="true" data-node-id="${escapeHtml(n.tool_id)}" class="wfb-palette-item flex items-stretch rounded-lg border border-border bg-canvas/50 hover:border-primary/40 hover:bg-canvas cursor-grab active:cursor-grabbing transition-colors overflow-hidden ${greyedClass}">
                    ${nodeIconChipHtml(n)}
                    <div class="flex-1 min-w-0 p-2.5">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-xs font-medium text-heading truncate">${escapeHtml(n.title)}</span>
                            <span class="flex items-center gap-1.5 shrink-0">
                                ${lockIcon}
                                <span class="text-[9px] font-mono uppercase ${KIND_COLORS[n.kind] || "text-muted"}">${KIND_LABELS[n.kind] || n.kind}</span>
                            </span>
                        </div>
                        <p class="text-[10px] text-muted leading-snug mt-1 line-clamp-2">${escapeHtml(n.description || "")}</p>
                    </div>
                </div>
            `;
            }).join("");

            container.querySelectorAll(".wfb-palette-item").forEach(el => {
                el.addEventListener("dragstart", (e) => {
                    const nodeMeta = registry.find(n => n.tool_id === el.dataset.nodeId);
                    e.dataTransfer.setData("application/json", JSON.stringify(nodeMeta));
                });
            });
        }

        function loadPalette() {
            return fetch("/api/workflow-builder/node-registry").then(r => r.json()).then(data => {
                registry = data.nodes || [];
                modelClassifications = data.model_classifications || { levels: [], labels: {}, models: {} };
                modelToggleOrder = data.model_toggle_order || Object.keys(modelClassifications.models || {});
                if (Object.keys(modelToggles).length === 0) {
                    // Conservative default: comes from the server (model_toggle_defaults)
                    // rather than being hardcoded here, so adding a new default-on model
                    // later doesn't require a frontend change.
                    const defaults = data.model_toggle_defaults || {};
                    modelToggleOrder.forEach(m => { modelToggles[m] = !!defaults[m]; });
                }
                renderModelToggles();
                renderPalette(document.getElementById("wfb-palette-search").value);
            });
        }

        // --- Model toggles + live classification ceiling -----------------------------
        // Toggles filter what's draggable from the palette; the classification badge
        // reflects what's actually PLACED on the canvas (a toggle being off doesn't
        // remove an already-placed node) -- see model_classifications.py for the
        // "most restrictive model wins" ceiling logic this mirrors client-side.
        // modelToggleOrder can include models absent from modelClassifications.models
        // (e.g. "m365" is deliberately not classification-affecting, see
        // model_classifications.py's module docstring) -- it's a superset used purely
        // for what toggles/filters exist, not for the ceiling computation below.

        function renderModelToggles() {
            const container = document.getElementById("wfb-model-toggles");
            const models = modelToggleOrder;
            if (!models.length) { container.innerHTML = ""; return; }

            container.innerHTML = models.map(m => {
                const on = !!modelToggles[m];
                const label = m.charAt(0).toUpperCase() + m.slice(1);
                return `
                    <label class="flex items-center gap-1.5 cursor-pointer select-none ${on ? "text-heading" : "text-muted"}">
                        <input type="checkbox" data-model-toggle="${m}" ${on ? "checked" : ""} class="accent-primary">
                        ${label}
                    </label>
                `;
            }).join("");

            container.querySelectorAll("[data-model-toggle]").forEach(el => {
                el.addEventListener("change", () => {
                    modelToggles[el.dataset.modelToggle] = el.checked;
                    renderModelToggles();
                    renderPalette(document.getElementById("wfb-palette-search").value);
                });
            });
        }

        function classificationCeilingOf(modelKeys) {
            const levels = modelClassifications.levels || [];
            const used = modelKeys
                .map(m => modelClassifications.models[m])
                .filter(Boolean);
            if (!used.length) return null;
            return used.reduce((worst, level) => levels.indexOf(level) < levels.indexOf(worst) ? level : worst, used[0]);
        }

        function recomputeClassificationBadge() {
            const badge = document.getElementById("wfb-classification-badge");
            if (!editor) return;

            const exported = editor.export().drawflow;
            const modelsUsed = new Set();
            Object.values(exported).forEach(moduleData => {
                Object.values(moduleData.data || {}).forEach(node => {
                    const model = node.data && node.data.model;
                    if (model) modelsUsed.add(model);
                });
            });

            const ceiling = classificationCeilingOf(Array.from(modelsUsed));
            badge.className = "px-2 py-0.5 rounded text-[10px] font-mono font-semibold uppercase border";
            if (!ceiling) {
                badge.textContent = "No AI model in use";
                badge.style.cssText = "background: transparent; color: var(--color-muted); border-color: var(--color-border);";
                return;
            }

            const label = (modelClassifications.labels || {})[ceiling] || ceiling;
            // Solid, unambiguous background color per classification level (set via
            // inline style, not Tailwind utility classes -- this project's compiled
            // output.css is a static pre-built bundle and doesn't include every
            // possible color/utility combination, only ones already used elsewhere).
            // Dark text throughout for contrast against these bright backgrounds.
            const badgeColors = {
                public: "#22c55e",       // green
                protected_a: "#eab308",  // yellow
                protected_b: "#f97316",  // orange
                protected_c: "#ef4444",  // red
            };
            const bg = badgeColors[ceiling] || "#9ca3af";
            badge.textContent = label;
            badge.style.cssText = `background: ${bg}; color: #1a1a1a; border-color: ${bg};`;
        }

        // --- Canvas / node lifecycle ----------------------------------------------------

        function nodeHtml(meta) {
            const lockBadge = meta.licensed === false
                ? `<div class="mt-1 inline-flex items-center gap-1 text-[9px] font-mono uppercase text-muted"><i class="fa-solid fa-lock"></i>Greyed Out &middot; License Required</div>`
                : "";
            return `
                <div class="wfb-node-card">
                    ${nodeIconChipHtml(meta)}
                    <div class="wfb-node-body">
                        <div class="wfb-node-title">${escapeHtml(meta.title)}</div>
                        <div class="wfb-node-kind">${KIND_LABELS[meta.kind] || meta.kind}</div>
                        ${lockBadge}
                    </div>
                </div>
            `;
        }

        function containerNodeHtml(title) {
            return `
                <div class="wfb-node-card">
                    <div class="wfb-icon-chip" style="background: color-mix(in oklch, var(--color-primary-400) 18%, transparent);">
                        <i class="fa-solid fa-box-archive" style="color: var(--color-primary-400); font-size: 15px;"></i>
                    </div>
                    <div class="wfb-node-body">
                        <div class="wfb-node-title">${escapeHtml(title)}</div>
                        <div class="wfb-node-kind">Container</div>
                        <button type="button" class="wfb-container-open-btn mt-1.5 w-full text-[10px] font-mono px-2 py-1 rounded bg-primary/15 hover:bg-primary/25 text-primary-400 transition-colors" onmousedown="event.stopPropagation()">
                            Open <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function addNodeToCanvas(meta, posX, posY) {
            if (meta.tool_id === "container") {
                containerCounter += 1;
                const moduleName = `container_${Date.now()}_${containerCounter}`;
                const title = `Container ${containerCounter}`;
                editor.addModule(moduleName);
                const data = { kind: "container", tool_id: "container", category: null, title, label: nextDefaultLabel("container"), description: "", params: {}, module_name: moduleName };
                editor.addNode("container", 1, 1, posX, posY, "kind-container", data, containerNodeHtml(title), false);
                return;
            }

            const data = {
                kind: meta.kind,
                tool_id: meta.tool_id,
                category: meta.category || null,
                title: meta.title,
                label: nextDefaultLabel(meta.tool_id),
                description: meta.description || "",
                model: meta.model || null,
                licensed: meta.licensed,
                icon_source: meta.icon_source || "fa",
                svgl_icon_url: meta.svgl_icon_url || null,
                fa_icon: meta.fa_icon || null,
                params: {},
            };
            let cssClass = HUMAN_CHECKPOINT_TOOL_IDS.includes(meta.tool_id) ? "kind-human-checkpoint" : `kind-${meta.kind}`;
            if (meta.licensed === false) cssClass += " kind-greyed";
            editor.addNode(meta.tool_id, 1, 1, posX, posY, cssClass, data, nodeHtml(meta), false);
            recomputeClassificationBadge();
        }

        function renderBreadcrumb() {
            const bar = document.getElementById("wfb-breadcrumb");
            if (moduleBreadcrumb.length <= 1) {
                bar.classList.add("hidden");
                bar.innerHTML = "";
                return;
            }
            bar.classList.remove("hidden");
            bar.innerHTML = moduleBreadcrumb.map((m, i) => {
                const isLast = i === moduleBreadcrumb.length - 1;
                const label = isLast
                    ? `<span class="text-heading">${escapeHtml(m.title)}</span>`
                    : `<span class="text-primary-400 hover:underline cursor-pointer" onclick="window.wfbGoToBreadcrumb(${i})">${escapeHtml(m.title)}</span>`;
                return i === 0 ? label : `<i class="fa-solid fa-chevron-right text-[9px] text-muted mx-1"></i>${label}`;
            }).join("");
        }

        function enterContainer(nodeId) {
            const data = editor.getNodeFromId(nodeId).data;
            if (!data || !data.module_name) return;
            editor.changeModule(data.module_name);
            currentModuleName = data.module_name;
            moduleBreadcrumb.push({ name: data.module_name, title: data.title || "Container" });
            renderBreadcrumb();
            clearPanel();
        }

        window.wfbGoToBreadcrumb = function(index) {
            moduleBreadcrumb = moduleBreadcrumb.slice(0, index + 1);
            const target = moduleBreadcrumb[moduleBreadcrumb.length - 1];
            editor.changeModule(target.name);
            currentModuleName = target.name;
            renderBreadcrumb();
            clearPanel();
        };

        window.wfbEnterContainerFromPanel = function(nodeId) {
            enterContainer(nodeId);
        };

        function initCanvasDrop() {
            const canvasEl = document.getElementById("wfb-canvas");
            canvasEl.addEventListener("dragover", (e) => e.preventDefault());
            canvasEl.addEventListener("drop", (e) => {
                e.preventDefault();
                const raw = e.dataTransfer.getData("application/json");
                if (!raw) return;
                const meta = JSON.parse(raw);
                const rect = editor.precanvas.getBoundingClientRect();
                const posX = (e.clientX * (1 / editor.zoom)) - (rect.x * (1 / editor.zoom));
                const posY = (e.clientY * (1 / editor.zoom)) - (rect.y * (1 / editor.zoom));
                addNodeToCanvas(meta, posX, posY);
            });
            canvasEl.addEventListener("click", (e) => {
                const btn = e.target.closest(".wfb-container-open-btn");
                if (!btn) return;
                const nodeEl = e.target.closest(".drawflow-node");
                if (!nodeEl) return;
                enterContainer(nodeEl.id.replace("node-", ""));
            });
        }

        function argFieldInputHtml(field, rawValue) {
            const val = escapeHtml(rawValue !== undefined && rawValue !== null ? rawValue : "");
            const monoClass = field.mono ? "font-mono" : "";
            if (field.type === "textarea") {
                return `<textarea data-arg-field="${field.key}" rows="3" placeholder="${escapeHtml(field.placeholder || "")}" class="w-full bg-canvas border border-border rounded px-3 py-2 text-heading text-[11px] ${monoClass} focus:outline-none focus:border-primary custom-scrollbar resize-none">${val}</textarea>`;
            }
            if (field.type === "select") {
                const opts = (field.options || []).map(o => `<option value="${escapeHtml(o)}" ${o === rawValue ? "selected" : ""}>${escapeHtml(o)}</option>`).join("");
                return `<select data-arg-field="${field.key}" class="w-full bg-canvas border border-border rounded px-3 py-2 text-body text-xs focus:outline-none focus:border-primary">${opts}</select>`;
            }
            return `<input type="${field.type === "number" ? "number" : "text"}" data-arg-field="${field.key}" value="${val}" placeholder="${escapeHtml(field.placeholder || "")}" class="w-full bg-canvas border border-border rounded px-3 py-2 text-heading text-xs ${monoClass} focus:outline-none focus:border-primary">`;
        }

        // Reconstructs each field's current value from the node's existing params.args
        // (positional: by index; json: by parsing the single JSON arg) so re-opening a
        // configured node shows what was saved, not a blank form.
        function currentArgFieldValues(schema, existingArgs) {
            if (schema.mode === "json") {
                try {
                    return JSON.parse((existingArgs || [])[0] || "{}");
                } catch (e) {
                    return {};
                }
            }
            const values = {};
            schema.fields.forEach((f, i) => { values[f.key] = (existingArgs || [])[i] || ""; });
            return values;
        }

        function renderArgFieldsPanel(nodeId, data, schema) {
            const body = document.getElementById("wfb-panel-body");
            const currentValues = currentArgFieldValues(schema, data.params.args);

            if (!schema.fields.length) {
                body.innerHTML = `<div class="text-muted leading-relaxed">${escapeHtml(data.title)} takes no configurable input -- it runs with its script's own fixed behavior.</div>`;
                body.dataset.readFn = "";
                return;
            }

            const fieldsHtml = schema.fields.map(f => `
                <label class="block text-muted font-mono uppercase tracking-wider text-[10px] mt-3 first:mt-0">${f.label}</label>
                ${argFieldInputHtml(f, currentValues[f.key])}
            `).join("");

            body.innerHTML = fieldsHtml +
                `<button onclick="window.wfbSaveNodePanel('${nodeId}')" class="w-full mt-3 px-3 py-1.5 bg-primary/15 hover:bg-primary/25 text-primary-400 border border-primary/30 text-xs font-semibold rounded transition-colors">Save Node Config</button>`;
            body.dataset.readFn = "arg-fields:" + data.tool_id;
        }

        function readArgFields(toolId) {
            const body = document.getElementById("wfb-panel-body");
            const schema = ARG_FIELD_SCHEMAS[toolId];
            if (!schema) return {};

            const values = {};
            schema.fields.forEach(f => {
                const el = body.querySelector(`[data-arg-field="${f.key}"]`);
                values[f.key] = el ? el.value : "";
            });

            if (schema.mode === "json") {
                return { args: [JSON.stringify(values)] };
            }
            return { args: schema.fields.map(f => values[f.key]) };
        }

        function otherCanvasNodes(nodeId) {
            return Object.keys(editor.export().drawflow[currentModuleName].data)
                .filter(id => id !== nodeId)
                .map(id => ({ id, title: editor.getNodeFromId(id).data.title }));
        }

        function allWorkflowLabels(excludeNodeId) {
            // Graph-wide (every module, not just the currently open one) --
            // labels must be unique across the whole flattened workflow,
            // the same way node IDs already are.
            const exported = editor.export().drawflow;
            const result = [];
            Object.values(exported).forEach(mod => {
                Object.entries(mod.data || {}).forEach(([id, node]) => {
                    if (id !== excludeNodeId) result.push({ id, label: node.data.label });
                });
            });
            return result;
        }

        function uniqueLabel(candidate, excludeNodeId) {
            const taken = new Set(allWorkflowLabels(excludeNodeId).map(n => n.label));
            if (!taken.has(candidate)) return candidate;
            let n = 2;
            while (taken.has(`${candidate}_${n}`)) n += 1;
            return `${candidate}_${n}`;
        }

        const labelCounters = {};
        function nextDefaultLabel(toolId) {
            labelCounters[toolId] = (labelCounters[toolId] || 0) + 1;
            return uniqueLabel(`${toolId}_${labelCounters[toolId]}`, null);
        }

        function directPredecessorLabels(nodeId) {
            const node = editor.getNodeFromId(nodeId);
            const connections = (node.inputs && node.inputs.input_1 && node.inputs.input_1.connections) || [];
            return connections.map(c => editor.getNodeFromId(c.node).data.label).filter(Boolean);
        }

        function renderInputsChips(nodeId) {
            const box = document.getElementById("wfb-panel-inputs");
            const labels = directPredecessorLabels(nodeId);
            if (!labels.length) {
                box.innerHTML = `<span class="text-muted text-[10px]">No connected inputs yet.</span>`;
                return;
            }
            box.innerHTML = labels.map(l => `<span class="px-2 py-1 rounded bg-canvas border border-border-strong font-mono text-[10px] text-primary-400 cursor-pointer hover:bg-primary/15" data-insert-label="${escapeHtml(l)}">{{${escapeHtml(l)}}}</span>`).join("");
        }

        function wfbRenameLabelReferences(oldLabel, newLabel) {
            // Connections never cross modules (Drawflow enforces this), and a
            // label is only ever referenceable via a direct connection -- so
            // only the current module can possibly contain a {{oldLabel}}
            // reference. No need to switch modules to check others.
            if (oldLabel === newLabel) return;
            const oldToken = "{{" + oldLabel + "}}";
            const newToken = "{{" + newLabel + "}}";
            const moduleData = editor.export().drawflow[currentModuleName].data;
            Object.entries(moduleData).forEach(([id, rawNode]) => {
                const params = rawNode.data.params || {};
                let changed = false;
                const newParams = {};
                Object.entries(params).forEach(([key, value]) => {
                    if (typeof value === "string" && value.includes(oldToken)) {
                        newParams[key] = value.split(oldToken).join(newToken);
                        changed = true;
                    } else if (Array.isArray(value)) {
                        // ARG_FIELD_SCHEMAS-backed nodes (curriculum_guide_to_tos,
                        // webscraper, abc_uploader, send_outlook_mail, etc.) and
                        // renderGenericArgsPanel store fields as params.args = [v1, v2, ...],
                        // not flat string params -- rewrite each string element the
                        // same way (a JSON-mode element is still just a string here).
                        newParams[key] = value.map(el => {
                            if (typeof el === "string" && el.includes(oldToken)) {
                                changed = true;
                                return el.split(oldToken).join(newToken);
                            }
                            return el;
                        });
                    } else {
                        newParams[key] = value;
                    }
                });
                if (changed) editor.updateNodeDataFromId(id, { ...rawNode.data, params: newParams });
            });
            if (selectedNodeId) selectNode(selectedNodeId);
        }

        window.wfbSaveLabel = function() {
            if (!selectedNodeId) return;
            const input = document.getElementById("wfb-panel-label-input");
            const requested = input.value.trim();
            if (!requested) { alert("Output label can't be empty."); return; }
            const finalLabel = uniqueLabel(requested, selectedNodeId);
            const node = editor.getNodeFromId(selectedNodeId);
            const oldLabel = node.data.label;
            editor.updateNodeDataFromId(selectedNodeId, { ...node.data, label: finalLabel });
            input.value = finalLabel;
            if (finalLabel !== oldLabel) wfbRenameLabelReferences(oldLabel, finalLabel);
            wfbLog(`Output label set to "${finalLabel}". Reference it elsewhere as {{${finalLabel}}}.`, "text-success-400");
        };

                <button onclick="window.wfbSaveNodePanel('${nodeId}')" class="w-full mt-3 px-3 py-1.5 bg-primary/15 hover:bg-primary/25 text-primary-400 border border-primary/30 text-xs font-semibold rounded transition-colors">Save Node Config</button>

        function renderLogicGatePanel(nodeId, data) {
            const body = document.getElementById("wfb-panel-body");

        function renderFunctionPanel(nodeId, data) {
            if (data.tool_id === "builtin_review_gate") { renderReviewGatePanel(nodeId, data); return; }
            if (data.tool_id === "function_logic_gate") { renderLogicGatePanel(nodeId, data); return; }

            // A real script from 13_Functions (category "09_Functions") is dispatched via
            // CLI args, not named params -- it needs ARG_FIELD_SCHEMAS' positional/json
            // field mapping, not the named-params mechanism built-in functions use below.
            if (data.category === "09_Functions") {
                const argSchema = ARG_FIELD_SCHEMAS[data.tool_id];
                if (argSchema) { renderArgFieldsPanel(nodeId, data, argSchema); return; }
                renderGenericArgsPanel(nodeId, data);
                return;
            }

            const schema = FUNCTION_FIELD_SCHEMAS[data.tool_id];
            if (!schema) {
                document.getElementById("wfb-panel-body").innerHTML = `<div class="text-danger-400">No config UI defined for "${escapeHtml(data.tool_id)}" yet.</div>`;
                return;
            }
            renderGenericFunctionFields(nodeId, data, schema);
        }

        function toPascalCase(toolId) {
            return toolId.split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("");
        }

        function selectNode(nodeId) {
            selectedNodeId = nodeId;
            const data = currentNodeData(nodeId);

            const header = document.getElementById("wfb-panel-header");
            header.classList.remove("hidden");
            document.getElementById("wfb-panel-label-input").value = data.label || "";
            renderInputsChips(nodeId);

            if (data.kind === "task" || data.kind === "process" || data.kind === "adapter") {
                const argSchema = ARG_FIELD_SCHEMAS[data.tool_id];
                if (FIELD_PARTIAL_TOOL_IDS.includes(data.tool_id)) {
                    renderFieldPartialPanel(nodeId, data);
                } else if (argSchema) {
                    renderArgFieldsPanel(nodeId, data, argSchema);
                } else {
                    renderGenericArgsPanel(nodeId, data);
                }
            } else if (data.kind === "skill") {
                renderSkillPanel(data);
            } else if (data.kind === "function") {
                renderFunctionPanel(nodeId, data);
            } else if (data.kind === "container") {
                renderContainerPanel(nodeId, data);
            }
        }

            selectedNodeId = null;

        window.wfbSaveNodePanel = function(nodeId) {
            const body = document.getElementById("wfb-panel-body");
            const readFn = body.dataset.readFn;

            if (readFn === "container-name") {
                const newTitle = body.querySelector("[data-panel-container-name]").value.trim() || "Container";
                const node = editor.getNodeFromId(nodeId);
                editor.updateNodeDataFromId(nodeId, { ...node.data, title: newTitle });
                const titleEl = document.querySelector(`#node-${nodeId} .wfb-node-title`);
                if (titleEl) titleEl.innerHTML = `<i class="fa-solid fa-box-archive text-primary-400 mr-1"></i>${escapeHtml(newTitle)}`;
                wfbLog(`Renamed container to "${newTitle}".`, "text-success-400");
                return;
            }

            let params = {};

            if (readFn === "field-partial") {
                const data = currentNodeData(nodeId);
                const mount = document.getElementById("wfb-panel-fields");
                params = window[`read${toPascalCase(data.tool_id)}Fields`](mount);
            } else if (readFn === "generic-args") {
                const raw = body.querySelector("[data-panel-args]").value;
                params = { args: raw.split("\n").map(s => s.trim()).filter(Boolean) };
            } else if (readFn && readFn.startsWith("generic-function:")) {
                params = readGenericFunctionFields(readFn.slice("generic-function:".length));
            } else if (readFn && readFn.startsWith("arg-fields:")) {
                params = readArgFields(readFn.slice("arg-fields:".length));
            } else if (readFn === "review-gate") {
                params = {
                    criteria: body.querySelector("[data-panel-criteria]").value,
                    loop_back_node_id: body.querySelector("[data-panel-loopback]").value || null,
                    max_attempts: parseInt(body.querySelector("[data-panel-max-attempts]").value, 10) || 3,
                };
            } else if (readFn === "logic-gate") {
                params = {
                    condition_type: body.querySelector("[data-panel-condition-type]").value,
                    condition_value: body.querySelector("[data-panel-condition-value]").value,
                    true_node_id: body.querySelector("[data-panel-true-node]").value || null,
                    false_node_id: body.querySelector("[data-panel-false-node]").value || null,
                };
            }

            saveNodeParams(nodeId, params);
            wfbLog(`Saved config for node "${currentNodeData(nodeId).title}".`, "text-success-400");
        };

        // --- Toolbar: New / Save / Delete / Load -----------------------------------

        function wfbLog(msg, colorClass) {
            const box = document.getElementById("wfb-run-log");
            const timestamp = new Date().toISOString().split("T")[1].substring(0, 8);
            box.innerHTML += `<div class="${colorClass || "text-muted"}">[${timestamp}] ${escapeHtml(msg)}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function wfbSetRunStatus(text, colorClass) {
            const el = document.getElementById("wfb-run-status");
            el.innerText = text;
            el.className = `text-[10px] font-mono ${colorClass || "text-muted"}`;
        }

        function loadWorkflowDropdown() {
            return fetch("/api/workflow-builder/workflows").then(r => r.json()).then(data => {
                const select = document.getElementById("wfb-load-select");
                select.innerHTML = `<option value="">-- Load saved workflow --</option>` +
                    (data.workflows || []).map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join("");
            });
        }

        window.wfbNew = function() {
            initEditor();
            currentWorkflowId = null;
            document.getElementById("wfb-workflow-name").value = "";
            document.getElementById("wfb-load-select").value = "";
            clearPanel();
            document.getElementById("wfb-run-log").innerHTML = `<div class="text-muted">// Configure nodes, connect them, and click Run.</div>`;
            wfbSetRunStatus("Ready", "text-muted");
            recomputeClassificationBadge();
        };

        window.wfbSave = async function() {
            const name = document.getElementById("wfb-workflow-name").value.trim();
            if (!name) { alert("Enter a workflow name first."); return; }

            const graphJson = editor.export();
            const body = JSON.stringify({ name, description: "", graph_json: graphJson });

            try {
                const response = currentWorkflowId
                    ? await fetch(`/api/workflow-builder/workflows/${currentWorkflowId}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body })
                    : await fetch("/api/workflow-builder/workflows", { method: "POST", headers: { "Content-Type": "application/json" }, body });
                const data = await response.json();
                if (!response.ok) { alert(data.detail || "Could not save workflow."); return; }
                if (data.id) currentWorkflowId = data.id;
                wfbLog(`Workflow "${name}" saved.`, "text-success-400");
                await loadWorkflowDropdown();
                document.getElementById("wfb-load-select").value = currentWorkflowId;
            } catch (err) {
                alert(`Save failed: ${err.message}`);
            }
        };

        window.wfbDelete = async function() {
            if (!currentWorkflowId) { alert("No saved workflow selected."); return; }
            if (!confirm("Delete this saved workflow? This cannot be undone.")) return;

            try {
                const response = await fetch(`/api/workflow-builder/workflows/${currentWorkflowId}`, { method: "DELETE" });
                if (!response.ok) { const data = await response.json(); alert(data.detail || "Could not delete."); return; }
                wfbLog("Workflow deleted.", "text-warning-400");
                window.wfbNew();
                await loadWorkflowDropdown();
            } catch (err) {
                alert(`Delete failed: ${err.message}`);
            }
        };

        document.getElementById("wfb-load-select") && document.getElementById("wfb-load-select").addEventListener("change", async function() {
            const id = this.value;
            if (!id) return;
            try {
                const response = await fetch(`/api/workflow-builder/workflows/${id}`);
                const data = await response.json();
                if (!response.ok) { alert(data.detail || "Could not load workflow."); return; }
                initEditor();
                editor.import(data.graph_json);
                currentWorkflowId = data.id;
                document.getElementById("wfb-workflow-name").value = data.name;
                clearPanel();
                wfbLog(`Loaded workflow "${data.name}".`, "text-info-400");
            } catch (err) {
                alert(`Load failed: ${err.message}`);
            }
        });

        // --- Run ------------------------------------------------------------------------

        window.wfbRun = async function() {
            const dryRun = document.getElementById("wfb-dry-run").checked;
            const graphJson = editor.export();

            wfbSetRunStatus("Running...", "text-warning-400");
            wfbLog(`Starting ${dryRun ? "dry" : "live"} run...`, "text-info-400");

            try {
                const response = await fetch("/api/workflow-builder/run", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ graph_json: graphJson, dry_run: dryRun }),
                });
                const data = await response.json();
                if (!response.ok) { wfbLog(data.detail || "Run failed to start.", "text-danger-400"); wfbSetRunStatus("Failed", "text-danger-400"); return; }

                (data.steps || []).forEach(step => {
                    const color = step.status === "success" ? "text-body" : "text-danger-400";
                    wfbLog(`[${step.kind || "?"}] ${step.title || step.node_id}: ${step.status}${step.output ? " -- " + step.output : ""}`, color);
                });

                if (data.success) {
                    wfbLog("Workflow run complete.", "text-success-400");
                    wfbSetRunStatus("Complete", "text-success-400");
                } else {
                    wfbLog("Workflow run finished with failures.", "text-danger-400");
                    wfbSetRunStatus("Failed", "text-danger-400");
                }
            } catch (err) {
                wfbLog(`System error: ${err.message}`, "text-danger-400");
                wfbSetRunStatus("Error", "text-danger-400");
            }
        };

        // --- Zoom -------------------------------------------------------------------

        window.wfbZoomIn = function() { editor.zoom_in(); };
        window.wfbZoomOut = function() { editor.zoom_out(); };
        window.wfbZoomReset = function() { editor.zoom_reset(); };

        // --- Boot -----------------------------------------------------------------------

        function initEditor() {
            const canvasEl = document.getElementById("wfb-canvas");
            canvasEl.innerHTML = "";
            editor = new window.Drawflow(canvasEl);
            editor.reroute = true;
            editor.start();

            editor.on("nodeSelected", (id) => selectNode(String(id)));
            editor.on("nodeUnselected", () => clearPanel());
            editor.on("nodeRemoved", (id) => {
                if (String(id) === selectedNodeId) clearPanel();
                recomputeClassificationBadge();
            });
            editor.on("import", () => recomputeClassificationBadge());

            currentModuleName = "Home";
            moduleBreadcrumb = [{ name: "Home", title: "Home" }];
            renderBreadcrumb();
        }

        ensureDrawflowLoaded().then(() => {
            initEditor();
            initCanvasDrop(); // bound once -- the #wfb-canvas element persists across initEditor() calls (New/Load only clear its innerHTML)
            loadPalette();
            loadWorkflowDropdown();
        }).catch(err => {
            document.getElementById("wfb-canvas").innerHTML = `<div class="p-6 text-danger-400 text-xs font-mono">Failed to load canvas engine: ${err.message}</div>`;
        });

        document.querySelectorAll('input[name="wfb-kind"]').forEach(radio => {
            radio.addEventListener("change", () => renderPalette(document.getElementById("wfb-palette-search").value));
        });

        document.getElementById("wfb-container-palette-item").addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("application/json", JSON.stringify({ tool_id: "container", kind: "container", title: "Container", description: "" }));
        });

        // One delegated focus listener covers every text/textarea field in
        // the node config panel, present and future, so click-to-insert
        // knows where to put the token without each renderXPanel wiring it.
        let wfbLastFocusedField = null;
        document.getElementById("wfb-panel-body").addEventListener("focusin", (e) => {
            if (e.target.matches("textarea, input[type='text']")) wfbLastFocusedField = e.target;
        });

        document.getElementById("wfb-panel-inputs").addEventListener("click", (e) => {
            const chip = e.target.closest("[data-insert-label]");
            if (!chip || !wfbLastFocusedField) return;
            const field = wfbLastFocusedField;
            const token = "{{" + chip.dataset.insertLabel + "}}";
            const cursor = field.selectionStart ?? field.value.length;
            field.value = field.value.slice(0, cursor) + token + field.value.slice(cursor);
            const newCursor = cursor + token.length;
            field.focus();
            field.setSelectionRange(newCursor, newCursor);
        });

        let wfbSuggestField = null;

        function closeTokenSuggest() {
            document.getElementById("wfb-token-suggest").classList.add("hidden");
            wfbSuggestField = null;
        }

        function openTokenSuggest(field) {
            if (!selectedNodeId) return;
            const labels = directPredecessorLabels(selectedNodeId);
            if (!labels.length) { closeTokenSuggest(); return; }
            const box = document.getElementById("wfb-token-suggest");
            box.innerHTML = labels.map(l => `<div class="px-3 py-1.5 hover:bg-primary/15 cursor-pointer font-mono" data-suggest-label="${escapeHtml(l)}">{{${escapeHtml(l)}}}</div>`).join("");
            const fieldRect = field.getBoundingClientRect();
            // #wfb-token-suggest is absolutely positioned, so its offsets must
            // be measured against its actual positioning context -- the
            // "relative" wrapper div (Step 1), not #wfb-panel-body, which has
            // no position set and sits below the title bar / label+inputs
            // header inside that wrapper.
            const panelRect = field.closest(".relative").getBoundingClientRect();
            box.style.left = (fieldRect.left - panelRect.left) + "px";
            box.style.top = (fieldRect.bottom - panelRect.top) + "px";
            box.style.width = fieldRect.width + "px";
            box.classList.remove("hidden");
            wfbSuggestField = field;
        }

        document.getElementById("wfb-panel-body").addEventListener("input", (e) => {
            const field = e.target;
            if (!field.matches("textarea, input[type='text']")) return;
            const cursor = field.selectionStart;
            const lastTwo = field.value.slice(Math.max(0, cursor - 2), cursor);
            if (lastTwo === "{{") {
                openTokenSuggest(field);
            } else {
                closeTokenSuggest();
            }
        });

        document.getElementById("wfb-token-suggest").addEventListener("mousedown", (e) => {
            const opt = e.target.closest("[data-suggest-label]");
            if (!opt || !wfbSuggestField) return;
            e.preventDefault(); // keep focus (and cursor position) in the field
            const field = wfbSuggestField;
            const cursor = field.selectionStart;
            const insertion = opt.dataset.suggestLabel + "}}";
            field.value = field.value.slice(0, cursor) + insertion + field.value.slice(cursor);
            const newCursor = cursor + insertion.length;
            field.focus();
            field.setSelectionRange(newCursor, newCursor);
            closeTokenSuggest();
        });

        document.addEventListener("click", (e) => {
            if (!e.target.closest("#wfb-token-suggest") && e.target !== wfbSuggestField) closeTokenSuggest();
        });

        document.getElementById("wfb-palette-search").addEventListener("input", function() {
            renderPalette(this.value);
        });
    })();
</script>
