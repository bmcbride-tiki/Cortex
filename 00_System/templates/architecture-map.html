<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex — Architecture Map</title>
<style>
:root {
  --bg: oklch(0.16 0.02 250);
  --panel: oklch(0.19 0.02 250);
  --panel-2: oklch(0.235 0.02 250);
  --border: oklch(0.28 0.02 250);
  --border-strong: oklch(0.35 0.02 250);
  --text: oklch(0.95 0.005 250);
  --text-body: oklch(0.78 0.01 250);
  --muted: oklch(0.58 0.015 250);
  --client: oklch(0.74 0.12 220);
  --route: oklch(0.72 0.17 150);
  --service: oklch(0.62 0.19 264);
  --db: oklch(0.80 0.15 85);
  --external: oklch(0.68 0.18 340);
  --critical: oklch(0.66 0.20 25);
  --accent: oklch(0.80 0.15 85);
  --accent-2: oklch(0.66 0.20 25);
}
:root[data-theme="light"], :root:not([data-theme="dark"]) {
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg: oklch(0.97 0.01 250);
    --panel: oklch(0.995 0.003 250);
    --panel-2: oklch(0.96 0.008 250);
    --border: oklch(0.88 0.012 250);
    --border-strong: oklch(0.78 0.015 250);
    --text: oklch(0.22 0.02 250);
    --text-body: oklch(0.38 0.015 250);
    --muted: oklch(0.55 0.014 250);
  }
}
:root[data-theme="light"] {
  --bg: oklch(0.97 0.01 250);
  --panel: oklch(0.995 0.003 250);
  --panel-2: oklch(0.96 0.008 250);
  --border: oklch(0.88 0.012 250);
  --border-strong: oklch(0.78 0.015 250);
  --text: oklch(0.22 0.02 250);
  --text-body: oklch(0.38 0.015 250);
  --muted: oklch(0.55 0.014 250);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text-body);
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
}
#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

/* Top bar */
#topbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  z-index: 20;
}
#topbar h1 {
  font-size: 14px; font-weight: 600; color: var(--text); margin: 0; white-space: nowrap;
}
#topbar h1 span { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 6px; }
#chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text-body); cursor: pointer; user-select: none;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  transition: background .12s, border-color .12s, color .12s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--border-strong); }
.chip.active { background: var(--service); border-color: var(--service); color: white; }
#zoom-controls { display: flex; gap: 4px; margin-left: auto; }
#zoom-controls button {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text-body); cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
#zoom-controls button:hover { border-color: var(--border-strong); color: var(--text); }

/* Body */
#body { flex: 1; display: flex; min-height: 0; }
#canvas-wrap { flex: 1; position: relative; overflow: hidden; cursor: grab; background: var(--bg); }
#canvas-wrap.dragging { cursor: grabbing; }
#canvas-wrap svg { width: 100%; height: 100%; display: block; }

.cluster-bg { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
.cluster-label {
  fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; font-family: "JetBrains Mono", ui-monospace, monospace;
}

.node rect.card {
  fill: var(--panel-2); stroke-width: 1.4; rx: 9; cursor: pointer;
  transition: opacity .15s;
}
.node.critical rect.card { stroke-width: 2.2; }
.node text.title { fill: var(--text); font-size: 12px; font-weight: 600; pointer-events: none; }
.node text.sub { fill: var(--muted); font-size: 10px; pointer-events: none; }
.node text.deadmark { fill: var(--critical); font-size: 9px; font-weight: 700; pointer-events: none; font-family: "JetBrains Mono", monospace; }
.node.dimmed { opacity: 0.14; }
.node.selected rect.card { stroke-width: 3; }

.badge-circle { pointer-events: none; }
.badge-text { fill: white; font-size: 9px; font-weight: 700; text-anchor: middle; pointer-events: none; font-family: "JetBrains Mono", monospace; }

.edge-path { fill: none; transition: opacity .15s; }
.edge-path.dimmed { opacity: 0.06; }
.edge-label { font-size: 9px; fill: var(--muted); font-family: "JetBrains Mono", ui-monospace, monospace; pointer-events: none; transition: opacity .15s; }
.edge-label.dimmed { opacity: 0.06; }

/* Sidebar */
#sidebar {
  width: 380px; min-width: 380px; background: var(--panel); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 18px 18px 40px;
}
#sidebar h2 { font-size: 15px; color: var(--text); margin: 0 0 4px; }
#sidebar .path {
  font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; color: var(--muted);
  background: var(--panel-2); padding: 4px 8px; border-radius: 5px; display: inline-block; margin: 6px 0 14px;
  word-break: break-all;
}
#sidebar .plain { font-size: 12.5px; line-height: 1.55; color: var(--text-body); margin-bottom: 14px; }
#sidebar .section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  font-family: "JetBrains Mono", monospace; font-weight: 700; margin: 16px 0 8px;
}
#sidebar ul.notes { margin: 0; padding-left: 16px; }
#sidebar ul.notes li { font-size: 11.5px; color: var(--text-body); margin-bottom: 6px; line-height: 1.5; }
#sidebar .taglist { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
#sidebar .tagpill {
  font-size: 9.5px; padding: 2px 7px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--border); color: var(--muted); font-family: "JetBrains Mono", monospace;
}
#sidebar .edgelist { list-style: none; padding: 0; margin: 0; }
#sidebar .edgelist li {
  font-size: 11px; padding: 6px 8px; margin-bottom: 4px; border-radius: 6px; background: var(--panel-2);
  color: var(--text-body); display: flex; justify-content: space-between; gap: 8px;
}
#sidebar .edgelist .arrow { color: var(--muted); font-family: "JetBrains Mono", monospace; }
#sidebar .fixitem, #sidebar .bugitem {
  font-size: 11.5px; padding: 8px 10px; border-radius: 7px; margin-bottom: 6px; line-height: 1.45;
}
#sidebar .fixitem { background: color-mix(in oklch, var(--route) 12%, var(--panel-2)); border: 1px solid color-mix(in oklch, var(--route) 30%, var(--border)); color: var(--text-body); }
#sidebar .bugitem { background: color-mix(in oklch, var(--critical) 12%, var(--panel-2)); border: 1px solid color-mix(in oklch, var(--critical) 30%, var(--border)); color: var(--text-body); }
#sidebar .sev { font-weight: 700; font-family: "JetBrains Mono", monospace; font-size: 9.5px; text-transform: uppercase; margin-right: 6px; }
#sidebar .sev.high { color: var(--critical); }
#sidebar .sev.med { color: var(--accent); }
#sidebar .sev.low { color: var(--muted); }
#sidebar .empty-hint { font-size: 12px; color: var(--muted); font-style: italic; }

#sidebar .legend { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
#sidebar .legend-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-body); }
#sidebar .legend-swatch { width: 14px; height: 3px; border-radius: 2px; flex-shrink: 0; }
#sidebar .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid; }

#sidebar .stat-row { display: flex; gap: 10px; margin: 10px 0 4px; }
#sidebar .stat { flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
#sidebar .stat .n { font-size: 20px; font-weight: 700; color: var(--text); font-family: "JetBrains Mono", monospace; }
#sidebar .stat .l { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Cortex Architecture Map <span id="node-count-label"></span></h1>
    <div id="chips"></div>
    <div id="zoom-controls">
      <button id="zoom-out" title="Zoom out">−</button>
      <button id="zoom-fit" title="Fit to screen">Fit</button>
      <button id="zoom-in" title="Zoom in">+</button>
    </div>
  </div>
  <div id="body">
    <div id="canvas-wrap">
      <svg id="svg" viewBox="0 0 2220 1780" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrow-critical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--critical)"></path>
          </marker>
          <marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
          </marker>
          <marker id="arrow-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--db)"></path>
          </marker>
          <marker id="arrow-mount" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--client)"></path>
          </marker>
          <marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--border-strong)"></path>
          </marker>
        </defs>
        <g id="viewport">
          <g id="cluster-layer"></g>
          <g id="edge-layer"></g>
          <g id="node-layer"></g>
        </g>
      </svg>
    </div>
    <div id="sidebar"></div>
  </div>
</div>

<script>
// =============================================================================
// DATA — clusters / nodes / edges / FIXES / KNOWN_BUGS
// Every path below is real and was confirmed by reading the file at that
// location during this map's generation. See sidebar default view for the
// "notable findings" writeup.
// =============================================================================

const clusters = [
  { id: 'client',   label: 'Client (Browser Pages)',        x: 40,   y: 20, w: 300, h: 1720 },
  { id: 'server',   label: 'Server Entry (server.py routes)', x: 400,  y: 20, w: 300, h: 1720 },
  { id: 'core',     label: 'Core Engine',                    x: 760,  y: 20, w: 300, h: 1720 },
  { id: 'data',     label: 'Data & Schema Layer',             x: 1120, y: 20, w: 300, h: 1720 },
  { id: 'tools',    label: 'Tools (Tasks / Functions / Adapters)', x: 1480, y: 20, w: 300, h: 1720 },
  { id: 'external', label: 'External Services',               x: 1840, y: 20, w: 340, h: 1720 },

const N = (id, cluster, label, sub, x, y, w, h, color, opts = {}) => ({
  id, cluster, label, sub, x, y, w, h, color, ...opts

const nodes = [
  // --- CLIENT ------------------------------------------------------------
  N('idx-html', 'client', 'index.html', 'App shell: sidebar nav, popup host', 60, 60, 260, 64, 'client', {

  N('copilot-html', 'client', 'copilot.html', 'Standalone M365 Copilot chat page', 60, 372, 260, 64, 'client', {

    notes: ['3 call sites (lines 236, 299, 409) all POST to /execute/05_Processes/copilot_bridge.', '⚠ That route 404s — see the bug badge on this node.'],

  N('srv-uploads', 'server', 'server.py — Upload + Dispatch', '/api/uploads/* (file → Task pipeline)', 420, 996, 260, 64, 'route', {
    role: 'Saves an uploaded file collision-safely into 01_inbox/, then triggers the matching import Task.',

  N('srv-mdeditor', 'server', 'server.py — MD Editor + run://', 'vault-path containment guard', 420, 1100, 260, 64, 'route', {

const svg = document.getElementById('svg');
const viewport = document.getElementById('viewport');
const clusterLayer = document.getElementById('cluster-layer');
const edgeLayer = document.getElementById('edge-layer');
const nodeLayer = document.getElementById('node-layer');
const sidebar = document.getElementById('sidebar');
const canvasWrap = document.getElementById('canvas-wrap');

const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
const outgoing = {}, incoming = {};
nodes.forEach(n => { outgoing[n.id] = []; incoming[n.id] = []; });
edges.forEach(e => { outgoing[e.from].push(e); incoming[e.to].push(e); });

const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, children = []) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  children.forEach(c => e.appendChild(c));
  return e;
}

// -- Clusters --
clusters.forEach(c => {
  clusterLayer.appendChild(el('rect', { class: 'cluster-bg', x: c.x, y: c.y, width: c.w, height: c.h, rx: 12 }));
  clusterLayer.appendChild(el('text', { class: 'cluster-label', x: c.x + 16, y: c.y + 26 }, [document.createTextNode(c.label)]));
});

// -- Edges (drawn before nodes) --
const edgeElsByTag = [];
function nodeSide(node, fromLeft) {
  const cx = fromLeft ? node.x + node.w : node.x;
  return { x: cx, y: node.y + node.h / 2 };
}
edges.forEach((e, i) => {
  const a = nodeById[e.from], b = nodeById[e.to];
  if (!a || !b) return;
  const goingRight = a.x <= b.x;
  const p1 = goingRight ? nodeSide(a, true) : nodeSide(a, false);
  const p2 = goingRight ? nodeSide(b, false) : nodeSide(b, true);
  const dx = Math.max(60, Math.abs(p2.x - p1.x) * 0.45);
  const c1x = goingRight ? p1.x + dx : p1.x - dx;
  const c2x = goingRight ? p2.x - dx : p2.x + dx;
  const d = `M ${p1.x} ${p1.y} C ${c1x} ${p1.y}, ${c2x} ${p2.y}, ${p2.x} ${p2.y}`;

  let strokeVar = 'var(--border-strong)', marker = 'arrow-normal', width = 1.4, dash = null;
  if (e.kind === 'critical') { strokeVar = 'var(--critical)'; marker = 'arrow-critical'; width = 2.4; }
  else if (e.kind === 'api') { strokeVar = 'var(--accent)'; marker = 'arrow-api'; width = 1.6; }
  else if (e.kind === 'db') { strokeVar = 'var(--db)'; marker = 'arrow-db'; width = 1.6; }
  else if (e.kind === 'mount') { strokeVar = 'var(--client)'; marker = 'arrow-mount'; width = 1.4; }
  if (e.bug) { strokeVar = 'var(--critical)'; marker = 'arrow-critical'; dash = '6,4'; width = 1.8; }

  const path = el('path', {
    class: 'edge-path', d, stroke: strokeVar, 'stroke-width': width,
    'marker-end': `url(#${marker})`, 'data-from': e.from, 'data-to': e.to, 'data-tags': e.tag.join(',')
  });
  if (dash) path.setAttribute('stroke-dasharray', dash);
  edgeLayer.appendChild(path);

  const midT = 0.5;
  const mx = Math.pow(1 - midT, 3) * p1.x + 3 * Math.pow(1 - midT, 2) * midT * c1x + 3 * (1 - midT) * Math.pow(midT, 2) * c2x + Math.pow(midT, 3) * p2.x;
  const my = Math.pow(1 - midT, 3) * p1.y + 3 * Math.pow(1 - midT, 2) * midT * p1.y + 3 * (1 - midT) * Math.pow(midT, 2) * p2.y + Math.pow(midT, 3) * p2.y;
  const stagger = (i % 3) * 11 - 11;
  const label = el('text', { class: 'edge-label', x: mx, y: my + stagger, 'text-anchor': 'middle', 'data-from': e.from, 'data-to': e.to, 'data-tags': e.tag.join(',') }, [document.createTextNode(e.label)]);
  edgeLayer.appendChild(label);
  edgeElsByTag.push({ path, label, edge: e });
});

// -- Nodes --
const nodeGroups = {};
nodes.forEach(n => {
  const g = el('g', { class: 'node' + (n.critical ? ' critical' : ''), 'data-id': n.id, 'data-tags': n.tag.join(',') });
  const rect = el('rect', { class: 'card', x: n.x, y: n.y, width: n.w, height: n.h, stroke: `var(--${n.color})` });
  g.appendChild(rect);

  const barW = 4;
  g.appendChild(el('rect', { x: n.x, y: n.y, width: barW, height: n.h, rx: 2, fill: `var(--${n.color})` }));

  const title = el('text', { class: 'title', x: n.x + 14, y: n.y + 24 }, [document.createTextNode(n.label)]);
  g.appendChild(title);
  const sub = el('text', { class: 'sub', x: n.x + 14, y: n.y + 42 }, [document.createTextNode(n.sub)]);
  g.appendChild(sub);

  if (n.tag.includes('dead-code')) {
    g.appendChild(el('text', { class: 'deadmark', x: n.x + n.w - 10, y: n.y + n.h - 10, 'text-anchor': 'end' }, [document.createTextNode('DEAD')]));
  }

  // badges
  let badgeX = n.x + n.w - 14;
  const fixList = FIXES[n.id], bugList = KNOWN_BUGS[n.id];
  if (bugList) {
    g.appendChild(el('circle', { class: 'badge-circle', cx: badgeX, cy: n.y - 2, r: 9, fill: 'var(--critical)' }));
    g.appendChild(el('text', { class: 'badge-text', x: badgeX, y: n.y + 1.5 }, [document.createTextNode(String(bugList.length))]));
    badgeX -= 22;
  }
  if (fixList) {
    g.appendChild(el('circle', { class: 'badge-circle', cx: badgeX, cy: n.y - 2, r: 9, fill: 'var(--route)' }));
    g.appendChild(el('text', { class: 'badge-text', x: badgeX, y: n.y + 1.5 }, [document.createTextNode(String(fixList.length))]));
  }

  g.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n.id); });
  g.addEventListener('mouseenter', () => { if (!selectedId) hoverNode(n.id); });
  g.addEventListener('mouseleave', () => { if (!selectedId) hoverNode(null); });

  nodeLayer.appendChild(g);
  nodeGroups[n.id] = g;
});

// -- Filters --
const CHIP_DEFS = [
  { id: 'overview', label: 'Overview' },
  { id: 'ai-bridges', label: 'AI Bridges' },
  { id: 'workflow-builder', label: 'Workflow Builder' },
  { id: 'm365', label: 'M365' },
  { id: 'documents', label: 'Documents' },
  { id: 'dead-code', label: 'Dead Code' },
  { id: 'all', label: 'Show All Wires' },
  { id: 'bugs', label: 'Roadmap & Bugs' },
];
let activeFilter = 'overview';
const chipsWrap = document.getElementById('chips');
CHIP_DEFS.forEach(c => {
  const btn = document.createElement('div');
  btn.className = 'chip' + (c.id === activeFilter ? ' active' : '');
  btn.textContent = c.label;
  btn.dataset.chip = c.id;
  btn.addEventListener('click', () => setFilter(c.id));
  chipsWrap.appendChild(btn);
});

function setFilter(id) {
  activeFilter = id;
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.chip === id));
  applyFilter();
}

function applyFilter() {
  if (activeFilter === 'bugs') {
    nodes.forEach(n => {
      const has = FIXES[n.id] || KNOWN_BUGS[n.id];
      nodeGroups[n.id].classList.toggle('dimmed', !has);
    });
    edgeElsByTag.forEach(({ path, label, edge }) => {
      const relevant = (FIXES[edge.from] || KNOWN_BUGS[edge.from] || FIXES[edge.to] || KNOWN_BUGS[edge.to] || edge.bug);
      path.classList.toggle('dimmed', !relevant);
      label.classList.toggle('dimmed', !relevant);
    });
    return;
  }
  nodes.forEach(n => {
    const match = activeFilter === 'all' ? true : n.tag.includes(activeFilter);
    nodeGroups[n.id].classList.toggle('dimmed', !match);
  });
  edgeElsByTag.forEach(({ path, label, edge }) => {
    const match = activeFilter === 'all' ? true : edge.tag.includes(activeFilter);
    path.classList.toggle('dimmed', !match);
    label.classList.toggle('dimmed', !match);
  });
}
applyFilter();

let selectedId = null;
function neighborsOf(id) {
  const s = new Set([id]);
  outgoing[id].forEach(e => s.add(e.to));
  incoming[id].forEach(e => s.add(e.from));
  return s;
}
function dimExcept(id) {
  if (!id) { applyFilter(); return; }
  const keep = neighborsOf(id);
  nodes.forEach(n => nodeGroups[n.id].classList.toggle('dimmed', !keep.has(n.id)));
  edgeElsByTag.forEach(({ path, label, edge }) => {
    const relevant = edge.from === id || edge.to === id;
    path.classList.toggle('dimmed', !relevant);
    label.classList.toggle('dimmed', !relevant);
  });
}
function hoverNode(id) { dimExcept(id); if (id) renderSidebar(id); else renderSidebarDefault(); }
function selectNode(id) {
  selectedId = selectedId === id ? null : id;
  Object.values(nodeGroups).forEach(g => g.classList.remove('selected'));
  if (selectedId) { nodeGroups[selectedId].classList.add('selected'); dimExcept(selectedId); renderSidebar(selectedId); }
  else { applyFilter(); renderSidebarDefault(); }
}
canvasWrap.addEventListener('click', () => { if (!isPanning) selectNode(null); });

function renderSidebar(id) {
  const n = nodeById[id];
  const outs = outgoing[id], ins = incoming[id];
  const fixList = FIXES[id] || [], bugList = KNOWN_BUGS[id] || [];
  sidebar.innerHTML = `
    <h2>${n.label}</h2>
    ${n.path ? `<div class="path">${n.path}</div>` : ''}
    <div class="plain">${n.plain || ''}</div>
    ${n.role ? `<div class="section-label">Technical role</div><div class="plain" style="margin-bottom:8px">${n.role}</div>` : ''}
    ${n.notes && n.notes.length ? `<div class="section-label">Notes</div><ul class="notes">${n.notes.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    ${bugList.length ? `<div class="section-label">Known issues</div>${bugList.map(b => `<div class="bugitem"><span class="sev ${b.sev}">${b.sev}</span>${b.t}</div>`).join('')}` : ''}
    ${fixList.length ? `<div class="section-label">Fixed this session</div>${fixList.map(f => `<div class="fixitem">#${f.n} — ${f.t}</div>`).join('')}` : ''}
    <div class="section-label">Tags</div>
    <div class="taglist">${n.tag.map(t => `<span class="tagpill">${t}</span>`).join('')}</div>
    ${outs.length ? `<div class="section-label">Outgoing (${outs.length})</div><ul class="edgelist">${outs.map(e => `<li><span>${e.label}</span><span class="arrow">→ ${nodeById[e.to].label}</span></li>`).join('')}</ul>` : ''}
    ${ins.length ? `<div class="section-label">Incoming (${ins.length})</div><ul class="edgelist">${ins.map(e => `<li><span>${nodeById[e.from].label} →</span><span class="arrow">${e.label}</span></li>`).join('')}</ul>` : ''}
  `;
}

  const bugCount = Object.values(KNOWN_BUGS).reduce((s, a) => s + a.length, 0);
  const fixCount = new Set(Object.values(FIXES).flat().map(f => f.n)).size;
  const deadCount = nodes.filter(n => n.tag.includes('dead-code')).length;
  sidebar.innerHTML = `
    <h2>Cortex — Full-Stack Map</h2>
    <div class="plain">FastAPI "Workbrain Operations Console": a browser UI backed by a subprocess-dispatch router (CoreRouter), a Drawflow-based workflow engine, two SQLite files, and 5 AI-model bridges (Copilot, Gemini, Claude, ChatGPT, NotebookLM) that all run in a mock-first mode until real credentials exist.</div>
    <div class="stat-row">
      <div class="stat"><div class="n">${nodes.length}</div><div class="l">Nodes</div></div>
      <div class="stat"><div class="n">${edges.length}</div><div class="l">Edges</div></div>

    </div>

    <div class="bugitem"><span class="sev high">high</span>copilot.html and gemini.html's standalone pages POST to /execute/05_Processes/{copilot,gemini}_bridge — a category string that resolves to the wrong folder (11_Processes instead of 14_Adapters). Every button on both pages 404s.</div>
    <div class="bugitem"><span class="sev low">low</span>An entire second "reference architecture" (CoreWorkflowRouter, canvas_schema/parser, observer_schema/transformer, enterprise_adapters, theme_exporter, svgl_icon_manager, runtime_state — ${deadCount} files) is fully built but reachable only from sandbox_smoke_test.py. The real app evolved its own separate, simpler engine instead.</div>

    <div class="section-label">Legend</div>
    <div class="legend">
      <div class="legend-row"><span class="legend-swatch" style="background:var(--critical)"></span> Critical path</div>
      <div class="legend-row"><span class="legend-swatch" style="background:var(--accent)"></span> External API call</div>
      <div class="legend-row"><span class="legend-swatch" style="background:var(--db)"></span> Database read/write</div>

      <div class="legend-row"><span class="legend-swatch" style="background:var(--border-strong)"></span> Normal / in-process call</div>

    </div>

  `;
}
renderSidebarDefault();

// -- Pan / zoom --
let viewBox = { x: 0, y: 0, w: 2220, h: 1780 };
let isPanning = false, panStart = null, didDrag = false;
function updateViewBox() { svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`); }
canvasWrap.addEventListener('mousedown', (e) => {
  isPanning = true; didDrag = false; canvasWrap.classList.add('dragging');
  panStart = { x: e.clientX, y: e.clientY, vb: { ...viewBox } };
});
window.addEventListener('mousemove', (e) => {
  if (!isPanning || !panStart) return;
  const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
  const scale = viewBox.w / canvasWrap.clientWidth;
  viewBox.x = panStart.vb.x - dx * scale;
  viewBox.y = panStart.vb.y - dy * scale;
  updateViewBox();
});
window.addEventListener('mouseup', () => { isPanning = false; canvasWrap.classList.remove('dragging'); setTimeout(() => didDrag = false, 0); });

canvasWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvasWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const fx = viewBox.x + (mx / rect.width) * viewBox.w;
  const fy = viewBox.y + (my / rect.height) * viewBox.h;
  const factor = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const newW = Math.min(6000, Math.max(300, viewBox.w * factor));
  const newH = newW * (viewBox.h / viewBox.w);
  viewBox.x = fx - (mx / rect.width) * newW;
  viewBox.y = fy - (my / rect.height) * newH;
  viewBox.w = newW; viewBox.h = newH;
  updateViewBox();
}, { passive: false });

function zoomBy(factor) {
  const cx = viewBox.x + viewBox.w / 2, cy = viewBox.y + viewBox.h / 2;
  const newW = Math.min(6000, Math.max(300, viewBox.w * factor));
  const newH = newW * (viewBox.h / viewBox.w);
  viewBox.x = cx - newW / 2; viewBox.y = cy - newH / 2;
  viewBox.w = newW; viewBox.h = newH;
  updateViewBox();
}
document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1 / 1.25));
document.getElementById('zoom-out').addEventListener('click', () => zoomBy(1.25));
document.getElementById('zoom-fit').addEventListener('click', () => { viewBox = { x: 0, y: 0, w: 2220, h: 1780 }; updateViewBox(); });
updateViewBox();

document.getElementById('node-count-label').textContent = `${nodes.length} nodes · ${edges.length} edges`;

// Re-bind background click to ignore drag-releases
canvasWrap.removeEventListener('click', () => {});
canvasWrap.addEventListener('click', (e) => {
  if (didDrag) return;
  if (e.target === svg || e.target === canvasWrap) selectNode(null);
});
</script>
